<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1e40af">
  <title>Fin de Carga — Turnero</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/turnero.css">
</head>
<body>

<!--
  Página PÚBLICA — sin login. Pensada para compartir el link directo a operarios de
  planta desde el celular. No usa Sesion en ningún lado: quién registra el fin de
  carga se elige del desplegable "Operario" (lista administrada en Administración).
-->
<div class="t-page">

  <header class="t-header">
    <div>
      <div class="t-header-title">Fin de Carga</div>
      <div class="t-header-sub">Turnero</div>
    </div>
    <div class="t-header-right">
      <div class="t-deposito-selector" id="t-deposito-selector">
        <button type="button" class="t-dep-btn" data-dep="MZA">MZA</button>
        <button type="button" class="t-dep-btn" data-dep="BUE">BUE</button>
      </div>
      <button type="button" class="t-tema-btn" id="btn-toggle-tema" title="Cambiar tema">🌙</button>
    </div>
  </header>

  <div class="t-cols-2">

    <div class="t-form-card">
      <div class="t-form-title">✅ Registrar fin de carga</div>
      <form id="form-fincarga">
        <div class="t-field">
          <label class="t-label">Operario — ¿quién sos?</label>
          <select class="t-select" id="sel-operario" required>
            <option value="">Elegí tu nombre…</option>
          </select>
        </div>
        <div class="t-field">
          <label class="t-label">Patente</label>
          <input class="t-input" id="in-patente-fincarga" autocomplete="off" autocapitalize="characters" placeholder="Ej: AB123CD" required>
        </div>
        <div class="t-field">
          <label class="t-label">Comentario / novedad (opcional)</label>
          <textarea class="t-input" id="in-comentario-fincarga" rows="3" style="resize:vertical"></textarea>
        </div>
        <div class="t-error-msg t-hidden" id="err-fincarga"></div>
        <button type="submit" class="t-btn primary" style="width:100%">Registrar fin de carga</button>
      </form>
    </div>

    <div class="t-form-card">
      <div class="t-form-title">🚛 En playa, esperando fin de carga</div>
      <div id="lista-pendientes"></div>
      <div class="t-empty t-hidden" id="empty-pendientes">No hay unidades esperando fin de carga.</div>
    </div>

  </div>

</div>

<div id="toast-container" style="position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;flex-direction:column;gap:8px;align-items:center"></div>

<script src="js/api.js"></script>
<script src="js/api-turnero.js"></script>
<script src="js/turnero-common.js"></script>
<script src="js/fincarga.js"></script>
</body>
</html>
