<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1e40af">
  <title>Tiempo de Carga — Turnero</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/turnero.css">
</head>
<body>

<div class="t-page">

  <header class="t-header">
    <div>
      <div class="t-header-title">Tiempo de carga</div>
      <div class="t-header-sub" id="t-fecha-hoy">Control diario</div>
    </div>
    <div class="t-header-right">
      <div class="t-deposito-selector" id="t-deposito-selector">
        <button type="button" class="t-dep-btn" data-dep="MZA">MZA</button>
        <button type="button" class="t-dep-btn" data-dep="BUE">BUE</button>
      </div>
      <button type="button" class="t-tema-btn" id="btn-toggle-tema" title="Cambiar tema">🌙</button>
      <a href="index.html" class="t-tema-btn" style="text-decoration:none">← Portería</a>
    </div>
  </header>

  <nav class="t-nav">
    <button class="t-nav-btn" data-pagina="playa">Playa en Vivo</button>
    <button class="t-nav-btn" data-pagina="turnos">Turnos</button>
    <button class="t-nav-btn" data-pagina="indicadores-playa">Indicadores</button>
    <button class="t-nav-btn activo" data-pagina="tiempodecarga">Tiempo de Carga</button>
    <button class="t-nav-btn" data-pagina="admin-turnero">Administración</button>
    <button class="t-nav-btn" data-pagina="fincarga">Fin de Carga</button>
  </nav>

  <div class="t-filtros">
    <div class="t-field">
      <label class="t-label">Tipo de unidad</label>
      <select class="t-select" id="sel-tipo-hoy"><option value="Todos">Todas</option></select>
    </div>
  </div>

  <div class="t-cols-2">
    <div>
      <div class="t-seccion-head" style="margin:0 0 10px">
        <span class="t-badge-seccion badge-con-turno">★ Con turno</span>
      </div>
      <div class="t-kpi-row" id="kpi-hoy-con-turno" style="padding:0 0 10px"></div>
      <div style="overflow-x:auto">
        <table class="t-ranking-tabla" id="tabla-hoy-con-turno"><thead></thead><tbody></tbody></table>
      </div>
      <button type="button" class="t-btn ghost t-mt t-hidden" id="btn-vertodos-con-turno"></button>
    </div>
    <div>
      <div class="t-seccion-head" style="margin:0 0 10px">
        <span class="t-badge-seccion badge-sin-turno">○ Sin turno</span>
      </div>
      <div class="t-kpi-row" id="kpi-hoy-sin-turno" style="padding:0 0 10px"></div>
      <div style="overflow-x:auto">
        <table class="t-ranking-tabla" id="tabla-hoy-sin-turno"><thead></thead><tbody></tbody></table>
      </div>
      <button type="button" class="t-btn ghost t-mt t-hidden" id="btn-vertodos-sin-turno"></button>
    </div>
  </div>

  <div class="t-resumen">Umbrales: tiempo de carga en rojo si supera 15 min · tiempo de control en rojo si supera 30 min.</div>

  <div class="t-filtros">
    <div class="t-field">
      <label class="t-label">Desde</label>
      <input type="date" class="t-input" id="in-desde-hist">
    </div>
    <div class="t-field">
      <label class="t-label">Hasta</label>
      <input type="date" class="t-input" id="in-hasta-hist">
    </div>
    <button type="button" class="t-btn primary" id="btn-aplicar-hist">Aplicar</button>
    <button type="button" class="t-btn ghost" id="btn-ultimos-30-hist">Últimos 30 días</button>
  </div>

  <div class="t-cols-2">
    <div class="t-chart-wrap">
      <div class="t-chart-title">Con turno — Carga + Control por día</div>
      <canvas id="chart-hist-con-turno" height="160"></canvas>
    </div>
    <div class="t-chart-wrap">
      <div class="t-chart-title">Sin turno — Carga + Control por día</div>
      <canvas id="chart-hist-sin-turno" height="160"></canvas>
    </div>
  </div>

</div>

<div id="toast-container" style="position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;flex-direction:column;gap:8px;align-items:center"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="js/api.js"></script>
<script src="js/api-turnero.js"></script>
<script src="js/turnero-common.js"></script>
<script src="js/tiempocarga.js"></script>
</body>
</html>
